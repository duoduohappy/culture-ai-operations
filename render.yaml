services:
- type: web
  name: culture-ai-operations
  runtime: node
  plan: free
  buildCommand: npm ci --omit=dev --ignore-scripts
  startCommand: npm start
  healthCheckPath: /api/health
  envVars:
  - key: NODE_VERSION
    value: 24.21.0
  - key: HOST
    value: 0.0.0.0
  - key: DATA_DIR
    value: /tmp/culture-ai-operations
  - key: DEMO_PASSWORD
    generateValue: true
  - key: AI_PROVIDER
    value: compatible
  - key: AI_BASE_URL
    value: ''
  - key: AI_MODEL
    value: ''
  - key: AI_API_KEY
    value: ''
  - key: DEMO_MODE
    value: ephemeral
